<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#17b2ff" />
    <title>PIKA VOLLEYBALL // POP ART EDITION</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Russo+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div class="pop-stage">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay"></div>
      </div>
      <div class="pop-rotate-overlay" role="alert" aria-live="polite">
        <div class="pop-rotate-card">
          <svg
            class="pop-rotate-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 64 64"
            width="64"
            height="64"
            aria-hidden="true"
            focusable="false"
          >
            <rect x="12" y="18" width="40" height="28" rx="4" fill="#ffe600" stroke="#111111" stroke-width="4" />
            <circle cx="46" cy="32" r="2.5" fill="#111111" />
            <path d="M 18 10 A 18 18 0 0 1 46 10" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" />
            <polygon points="48,14 48,4 39,11" fill="#111111" />
          </svg>
          <span class="pop-badge pop-badge--magenta">LANDSCAPE ONLY</span>
          <h2 class="pop-rotate-title">가로 모드로 회전해 주세요!</h2>
          <p class="pop-rotate-desc">이 게임은 가로 화면에 최적화되어 있습니다.</p>
        </div>
      </div>
    </div>
    <video id="webcam-video" playsinline muted style="display:none"></video>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
